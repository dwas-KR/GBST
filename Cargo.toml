[workspace]
members = [
    "crates/gbst-core",
    "crates/gbst-adb",
    "crates/gbst-gui",
]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2024"
license = "GPL-3.0-only"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
dirs = "7"
chrono = { version = "0.4", features = ["clock"] }
ureq = "3"
adb_client = { version = "=3.2.3", features = ["usb"] }
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.11"
hex = "0.4"
serde_json = "1"
semver = "1"
sys-locale = "0.3"
iced = { version = "0.14", features = ["tokio", "image", "svg", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt", "macros"] }
open = "5"
flate2 = "1"

[patch.crates-io]
adb_client = { path = "vendor/adb_client" }
