[workspace]
members = [
    "crates/gbst-core",
    "crates/gbst-adb",
    "crates/gbst-gui",
]
resolver = "2"

[workspace.package]
version = "1.1.2"
edition = "2024"
license = "CC-BY-NC-SA-4.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
dirs = "6"
chrono = { version = "0.4", features = ["clock"] }
ureq = "2"
adb_client = { version = "3", features = ["usb"] }
rsa = { version = "0.9", features = ["pem"] }
sha2 = "0.11"
hex = "0.4"
base64 = "0.22"
serde_json = "1"
semver = "1"
sys-locale = "0.3"
iced = { version = "0.14", features = ["tokio", "image", "advanced"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio = { version = "1", features = ["rt", "macros"] }
open = "5"
flate2 = "1"
